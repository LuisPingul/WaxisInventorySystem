<div class="ingredient-card bg-white border border-gray-200 rounded-2xl p-5 shadow-sm {% if disabled %}opacity-50{% endif %}" data-item-id="{{ item.id }}">
    <!-- Card Header -->
    <div class="flex justify-between items-start mb-6">
        <div>
            <h3 class="text-lg font-bold text-slate-800">{{ item.name }}</h3>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mt-1">{{ item.category }}</p>
        </div>
        <!-- Current Stock Badge -->
        <div class="bg-gray-50 rounded-xl px-4 py-2 flex flex-col items-center justify-center min-w-[4.5rem]">
            <span class="text-xl font-extrabold text-slate-800">{{ item.quantity|floatformat:"2" }}</span>
            <span class="text-[10px] font-bold text-slate-500 uppercase">{{ item.unit }}</span>
        </div>
    </div>
    
    <!-- Deduct Form -->
    <form method="POST" action="{% url 'deduct_stock_item' item.id %}" class="flex flex-col gap-3 w-full mt-2"
          hx-post="{% url 'deduct_stock_item' item.id %}" 
          hx-target="closest .ingredient-card" 
          hx-swap="outerHTML" 
          hx-on::after-request="if(event.detail.successful) { showToast('Deducted successfully') }">
        {% csrf_token %}
        {{ form.ingredient }}
        <div class="flex flex-col gap-3 w-full">
            <!-- Quantity Input -->
            <input 
                type="number" 
                name="deduct_quantity"
                step="any"
                min="0"
                max="{{ item.quantity }}"
                placeholder="Qty in {{ item.unit|lower }}..." 
                class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition-all"
                required
            >
            
            <!-- Transaction Reason Dropdown -->
            <select 
                name="transaction_reason" 
                class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition-all appearance-none bg-white"
                required
            >
                <option value="" disabled selected>Select Reason...</option>
                <option value="NORMAL_USAGE">Normal Usage</option>
                <option value="SPOILAGE_WASTE">Spoilage/Waste</option>
                <option value="DAMAGED">Damaged</option>
                <option value="OTHER">Other</option>
            </select>
            
            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl transition-colors shadow-sm mt-1"
                {% if disabled %}disabled{% endif %}
            >
                Deduct
            </button>
        </div>
        {% if form.errors %}
            <div class="mt-3 p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">
                {% for field, errors in form.errors.items %}
                    {% for error in errors %}
                        <div>{{ error }}</div>
                    {% endfor %}
                {% endfor %}
            </div>
        {% endif %}
    </form>
</div>
