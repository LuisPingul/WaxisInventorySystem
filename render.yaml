services:
  - type: web
    name: waxis-inventory
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://waxis-inventory.onrender.com"
      - key: DATABASE_URL
        sync: false
cronJobs:
  - type: cron
    name: waxis-forecasts
    env: python
    plan: free
    schedule: "0 18 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py compute_forecasts"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
